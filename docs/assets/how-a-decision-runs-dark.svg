<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="482" viewBox="0 0 1202 482" role="img" aria-labelledby="t d">
<title id="t">How a Drex decision runs</title>
<desc id="d">Three columns, left to right. You send a POST to /v1/systemone with a state, the ticket text 'I was charged twice for the same order. Please refund the extra payment.', and three named questions: team (choice), refund (noul) and urgency (score). Drex answers with Drex Max, Drex v2.0, Drex v1.5 or Drex DLM, runs on Python, Kapitsa, MLX, llama.cpp and Ollama, and generates nothing. You get back a probability for every option: for team, billing 0.9926, technical 0.0024 and other 0.005; for refund, yes 0.9931; for urgency, Routine 0.2489, Soon 0.166 and Urgent 0.5851, a score of 1.3362. This is a bf16 CUDA run of examples/request.json with Drex v1.5.</desc>
<style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#8A9690}.cd{fill:#FFFFFF;fill-opacity:.03;stroke:#2A3630;stroke-width:1.2}.kn{font-size:14px;font-weight:700;letter-spacing:.13em;fill:#3FB55A}.cap{font-size:13px;letter-spacing:.12em;fill:#76827B}.ttl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;fill:#E8EEE9}.nm{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:650;fill:#E8EEE9}.bd{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:#8A9690}.lb{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;fill:#8A9690}.lm{font-size:14px;fill:#8A9690}.cm{font-size:16px;fill:#E8EEE9}.cg{font-size:16px;font-weight:700;fill:#9DF0B0}.ch{fill:#FFFFFF;stroke:#2A3630;stroke-width:1.2}.tn{fill:#173323;fill-opacity:.55;stroke:#3FB55A;stroke-opacity:.45}.dv{fill:none;stroke:#1D2622;stroke-width:1.2}.ag{fill:none;stroke:#3FB55A;stroke-opacity:.3;stroke-width:8;stroke-linecap:round}.al{fill:none;stroke:#9DF0B0;stroke-width:2.2;stroke-linecap:round}.ah{fill:#9DF0B0}.f2{fill:#1E5A30}.bm{stroke:#9DF0B0}.ch{fill-opacity:.04}</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101713"/><stop offset="1" stop-color="#0B0F0D"/></linearGradient><linearGradient id="kin" x1="0" x2="46.25" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9DF0B0" stop-opacity="0"/><stop offset="1" stop-color="#9DF0B0"/></linearGradient></defs>
<rect x=".75" y=".75" width="1200.5" height="480.5" rx="28" fill="url(#pg)" stroke="#1D2622" stroke-width="1.5"/>
<rect x="28" y="28" width="300" height="426" rx="20" class="cd"/><text x="54" y="66" class="kn">YOU SEND</text><text x="54" y="106" class="cg">POST /v1/systemone</text><text x="54" y="142" class="cap">STATE</text><text x="54" y="167" class="bd">I was charged twice for the</text><text x="54" y="187" class="bd">same order. Please refund</text><text x="54" y="207" class="bd">the extra payment.</text><text x="54" y="242" class="cap">QUESTIONS</text><rect x="54" y="252" width="248" height="34" rx="10" class="ch"/><text x="68" y="274.5" class="nm">team</text><text x="288" y="274.5" class="bd" text-anchor="end">choice</text><rect x="54" y="298" width="248" height="34" rx="10" class="ch"/><text x="68" y="320.5" class="nm">refund</text><text x="288" y="320.5" class="bd" text-anchor="end">noul</text><rect x="54" y="344" width="248" height="34" rx="10" class="ch"/><text x="68" y="366.5" class="nm">urgency</text><text x="288" y="366.5" class="bd" text-anchor="end">score</text>
