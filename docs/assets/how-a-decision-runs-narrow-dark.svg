<rect x="28" y="482" width="344" height="378" rx="20" class="cd"/><text x="54" y="520" class="kn">DREX</text><rect x="54" y="544" width="292" height="34" rx="10" class="ch"/><text x="68" y="566.5" class="nm">Drex Max</text><rect x="54" y="590" width="292" height="34" rx="10" class="ch"/><text x="68" y="612.5" class="nm">Drex v2.0</text><rect x="54" y="636" width="292" height="34" rx="10" class="ch"/><text x="68" y="658.5" class="nm">Drex v1.5</text><rect x="54" y="682" width="292" height="34" rx="10" class="ch"/><text x="68" y="704.5" class="nm">Drex DLM</text><text x="54" y="751" class="nm">Nothing is generated</text><text x="54" y="786" class="cap">RUNS ON</text><text x="54" y="811" class="bd">Python, Kapitsa, MLX,</text><text x="54" y="831" class="bd">llama.cpp and Ollama</text>
